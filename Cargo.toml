[workspace]
resolver = "2"
members = [
    "crates/xlatch-core",
    "crates/xlatch-cli",
    "crates/xlatch-tui",
    "crates/xlatch-mcp",
    "crates/byteowlz-tui-kit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/byteowlz/xlatch"
readme = "README.md"
keywords = ["cli", "automation", "capabilities"]
categories = ["command-line-utilities"]

[workspace.dependencies]
time = "=0.3.46"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# Shared across workspace
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
log = "0.4"
env_logger = "0.11"
config = { version = "0.15", default-features = false, features = ["toml", "json"] }
dirs = "6.0"
shellexpand = "3.1"

# Capability service
rusqlite = { version = "0.38", features = ["bundled"] }
p256 = { version = "0.13.2", features = ["ecdsa"] }
ed25519-dalek = "2.2"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1.22", features = ["v4"] }
jsonschema = { version = "0.46", default-features = false }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
url = "2.5"
fs2 = "0.4"

# CLI
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"

# TUI
ratatui = "0.30"
crossterm = "0.29"

# Async runtime
tokio = { version = "1.50", features = ["full"] }

# API/HTTP
axum = "0.8"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# MCP
rmcp = { version = "2.2", features = ["server", "transport-io"] }
# Pinned exactly and on purpose: rmcp declares rmcp-macros with a caret range, so
# cargo will happily pair an older rmcp with newer macros that generate calls into
# APIs it does not have. Bump this in lockstep with rmcp.
rmcp-macros = "=2.2.0"

# Schema generation
schemars = "1.2"

# Internal crates
xlatch-core = { path = "crates/xlatch-core" }
byteowlz-tui-kit = { path = "crates/byteowlz-tui-kit" }

# ============================================
# MAXIMUM PRESET - rust-magic-linter
# ============================================
# Everything at deny level - maximum strictness
# https://github.com/vicnaum/rust-magic-linter

[workspace.lints.rust]
# Safety - forbid means even #![allow(...)] can't override
unsafe_code = "forbid"
non_ascii_idents = "forbid"

# Quality enforcement
warnings = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }

# Documentation enforcement
missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unfulfilled_lint_expectations = "deny"

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }

[workspace.lints.clippy]
# === ALL LINT GROUPS AT DENY ===
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# === THE GUARDRAILS ===
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Code hygiene
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# === ASYNC SAFETY ===
await_holding_lock = "deny"
large_futures = "deny"

# === PROCESS/MEMORY SAFETY ===
exit = "deny"
mem_forget = "deny"

# === PERFORMANCE ===
large_stack_arrays = "deny"
large_types_passed_by_value = "deny"

# === MINIMAL RELAXATIONS ===
# Only the absolutely necessary ones
multiple_crate_versions = "allow"   # Unavoidable with transitive deps

# Cast lints - too many false positives even for strict projects
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"

# Nursery lints that have too many false positives
cognitive_complexity = "allow"      # Use clippy.toml threshold instead

# CLI/TUI/API templates need stdout/stderr output
print_stdout = "allow"              # CLIs/TUIs/APIs need to print to stdout
print_stderr = "allow"              # CLIs/TUIs/APIs need to print to stderr

# CLI option structs inherently have many boolean flags
struct_excessive_bools = "allow"    # CLI flag structs have many bools
