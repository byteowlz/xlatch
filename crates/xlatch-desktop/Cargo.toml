[package]
name = "xlatch-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Optional native GPUI management client for xlatch"

[lints]
workspace = true

[features]
default = []
desktop = ["dep:gpui-kit"]
tray = ["desktop", "dep:tray-icon", "dep:image"]

[[bin]]
name = "xlatch-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
xlatch-core = { path = "../xlatch-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
gpui-kit = { workspace = true, optional = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { workspace = true, optional = true }
image = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
